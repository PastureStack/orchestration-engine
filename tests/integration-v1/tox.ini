[tox]
envlist=flake8, py314

[testenv]
deps=-rrequirements.txt
basepython=python3.14
changedir=cattletest
setenv=PYTHONPATH={toxinidir}/../integration-client
commands=
    python -m unittest discover -s ../integration-client -p test_compat_client.py
    pytest --durations=20 {posargs}

[testenv:flake8]
deps=flake8==7.3.0
basepython=python3.14
changedir={toxinidir}
commands=flake8 cattletest ../integration-client
