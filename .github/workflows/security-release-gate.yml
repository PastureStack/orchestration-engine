name: Security release gate

on:
  push:
    branches:
      - 'verification/orchestration-engine-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestration-engine-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DAPPER_IMAGE: pasturestack/orchestration-engine-dapper:${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      CYCLONEDX_MAVEN_PLUGIN_VERSION: 2.9.3
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-revision.txt
          : > evidence/source-status.txt
          sha256sum ubuntu-apt.lock ubuntu-security-packages.lock scripts/install-ubuntu-security-updates.sh .mvn/wrapper/maven-wrapper.properties > evidence/source-locks.sha256
          python3 tools/pip-security-overlay/test-pip-vex.py -v
          python3 .github/scripts/test_runtime_vulnerability_policy.py

      - name: Build and test all Maven modules
        shell: bash
        run: |
          set -euo pipefail
          make DAPPER_IMAGE="$DAPPER_IMAGE" ci
          test -s dist/artifacts/cattle.jar
          cp dist/version evidence/engine-version.txt
          sha256sum dist/artifacts/cattle.jar > evidence/cattle.jar.sha256

