              org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_MAVEN_PLUGIN_VERSION}:makeAggregateBom \
              -DoutputFormat=json \
              -DoutputName=cattle-cyclonedx \
              -DoutputDirectory=/usr/src/pasturestack/orchestration-engine/evidence \
              -DoutputReactorProjects=false \
              -DprojectType=application \
              -DincludeCompileScope=true \
              -DincludeProvidedScope=true \
              -DincludeRuntimeScope=true \
              -DincludeSystemScope=true \
              -DincludeTestScope=false \
              -Dcyclonedx.skipAttach=true"
          test -s evidence/cattle-cyclonedx.json

      - name: Scan source, product artifact, and Dapper image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          source_tree=$(mktemp -d)
          trap 'rm -rf "$source_tree"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$source_tree"
          docker run --rm \
            -v "$source_tree:/scan:ro" \
            -v "$PWD/evidence:/evidence" \
            -v "$HOME/.m2:/root/.m2:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
            --offline-scan --scanners secret --format json --output /evidence/source-secrets.raw.json /scan
          jq 'walk(if type == "object" then del(.Match, .Code) else . end)' \
            evidence/source-secrets.raw.json > evidence/source-secrets.json
          rm -f evidence/source-secrets.raw.json
          rm -rf "$source_tree"
          trap - EXIT
          artifact_tree=$(mktemp -d)
          trap 'rm -rf "$artifact_tree"' EXIT
          unzip -q dist/artifacts/cattle.jar -d "$artifact_tree"
          test -d "$artifact_tree/WEB-INF/lib"
          artifact_evidence="$PWD/evidence"
          (
            cd "$artifact_tree/WEB-INF/lib"
            find . -maxdepth 1 -type f -name '*.jar' -print0 | \
              LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$artifact_evidence/cattle-artifact-jars.sha256"
          test "$(wc -l < "$artifact_evidence/cattle-artifact-jars.sha256")" -gt 0
          docker run --rm \
            -v "$PWD/evidence:/evidence" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" sbom \
            --offline-scan --scanners vuln --list-all-pkgs --format json --output /evidence/cattle-artifact-vulnerabilities.json \
            /evidence/cattle-cyclonedx.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v "$HOME/.m2:/root/.m2:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --offline-scan --scanners vuln --list-all-pkgs --format json --output /work/evidence/dapper-image-vulnerabilities.raw.json \
            "$DAPPER_IMAGE"
          cp security/ubuntu-apt-fixed.openvex.json evidence/dapper-apt-fixed.openvex.json
          cp security/ubuntu-apt-fixed.sha256 evidence/dapper-apt-official-elf.sha256
          docker run --rm --network none --entrypoint sha256sum "$DAPPER_IMAGE" \
            /usr/bin/apt /usr/bin/apt-cache /usr/bin/apt-cdrom /usr/bin/apt-config \
            /usr/bin/apt-get /usr/bin/apt-mark /usr/lib/apt/apt-extracttemplates /usr/lib/apt/apt-helper \
            /usr/lib/apt/methods/cdrom /usr/lib/apt/methods/copy /usr/lib/apt/methods/file /usr/lib/apt/methods/gpgv \
            /usr/lib/apt/methods/http /usr/lib/apt/methods/mirror /usr/lib/apt/methods/rred /usr/lib/apt/methods/store \
            /usr/lib/apt/solvers/dump /usr/lib/x86_64-linux-gnu/libapt-pkg.so.7.0.0 /usr/lib/x86_64-linux-gnu/libapt-private.so.0.0.0 > evidence/dapper-apt-installed-elf.sha256
          python3 scripts/check-apt-fixed-vex.py \
            --dpkg evidence/dapper-dpkg.tsv --inspect evidence/dapper-image-inspect.json \
            --raw evidence/dapper-image-vulnerabilities.raw.json \
            --installed evidence/dapper-apt-installed-elf.sha256 \
            --vex evidence/dapper-apt-fixed.openvex.json --inputs-only
          docker run --rm --network none \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --offline-scan --scanners vuln --list-all-pkgs \
            --skip-db-update --skip-java-db-update --skip-vex-repo-update \
            --vex /work/evidence/dapper-apt-fixed.openvex.json \
            --format json --output /work/evidence/dapper-image-vulnerabilities.apt-fixed.json \
            "$DAPPER_IMAGE"
          # Both original scans independently use the same exact installed vendor proof.
          # Keep their original reports; compare only the explicitly pip-qualified views.
          dapper_subject="$(docker image inspect --format '{{.Id}}' "$DAPPER_IMAGE")"
          python3 tools/pip-security-overlay/filter-pip-vendor-findings.py \
            --raw evidence/dapper-image-vulnerabilities.raw.json \
            --proof evidence/dapper-pip-vendor-proof.json \
            --output evidence/dapper-image-vulnerabilities.raw-pip-qualified.json \
            --vex evidence/dapper-pip-vendor.raw-qualified.vex.json \
            --subject "$dapper_subject"
          python3 tools/pip-security-overlay/filter-pip-vendor-findings.py \
            --raw evidence/dapper-image-vulnerabilities.apt-fixed.json \
            --proof evidence/dapper-pip-vendor-proof.json \
            --output evidence/dapper-image-vulnerabilities.apt-fixed-pip-qualified.json \
            --vex evidence/dapper-pip-vendor.vex.json \
            --subject "$dapper_subject"
          python3 scripts/check-apt-fixed-vex.py \
            --dpkg evidence/dapper-dpkg.tsv --inspect evidence/dapper-image-inspect.json \
            --raw evidence/dapper-image-vulnerabilities.raw-pip-qualified.json \
            --installed evidence/dapper-apt-installed-elf.sha256 \
            --vex evidence/dapper-apt-fixed.openvex.json \
            --native evidence/dapper-image-vulnerabilities.apt-fixed-pip-qualified.json \
            --proof evidence/dapper-apt-fixed-vex-proof.json
          cp evidence/dapper-image-vulnerabilities.apt-fixed-pip-qualified.json evidence/dapper-image-vulnerabilities.json
          # A scanner which misses an ELF is not a clean Go dependency scan.
          jq -e 'any(.Results[]?; .Type == "gobinary" and
            (.Target | endswith("/docker")) and (.Packages | length > 0))' \
            evidence/dapper-image-vulnerabilities.raw.json >/dev/null
          python3 .github/scripts/enforce-runtime-vulnerabilities.py \
            --phase artifact --repository PastureStack/orchestration-engine
          python3 .github/scripts/enforce-runtime-vulnerabilities.py \
            --phase builder --repository PastureStack/orchestration-engine
          rm -rf "$artifact_tree"
          trap - EXIT

      - name: Summarize scan evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_secrets=$(jq '[.Results[]?.Secrets[]?] | length' evidence/source-secrets.json 2>/dev/null || echo missing)
          artifact_critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' evidence/cattle-artifact-vulnerabilities.json 2>/dev/null || echo missing)
          artifact_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' evidence/cattle-artifact-vulnerabilities.json 2>/dev/null || echo missing)
          artifact_targets=$(jq '[.Results[]?] | length' evidence/cattle-artifact-vulnerabilities.json 2>/dev/null || echo missing)
          artifact_packages=$(jq '[.Results[]?.Packages[]?] | length' evidence/cattle-artifact-vulnerabilities.json 2>/dev/null || echo missing)
          artifact_components=$(jq '[.components[]?] | length' evidence/cattle-cyclonedx.json 2>/dev/null || echo missing)
          artifact_jars=$(wc -l < evidence/cattle-artifact-jars.sha256 2>/dev/null | tr -d ' ' || echo missing)
          dapper_critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' evidence/dapper-image-vulnerabilities.json 2>/dev/null || echo missing)
          dapper_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' evidence/dapper-image-vulnerabilities.json 2>/dev/null || echo missing)
          {
            printf 'source_secrets=%s\n' "$source_secrets"
            printf 'artifact_critical=%s\n' "$artifact_critical"
            printf 'artifact_high=%s\n' "$artifact_high"
            printf 'artifact_targets=%s\n' "$artifact_targets"
            printf 'artifact_packages=%s\n' "$artifact_packages"
            printf 'artifact_components=%s\n' "$artifact_components"
            printf 'artifact_jars=%s\n' "$artifact_jars"
            printf 'dapper_critical=%s\n' "$dapper_critical"
            printf 'dapper_high=%s\n' "$dapper_high"
            printf 'artifact_fixed_all=%s\n' "$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length' evidence/cattle-artifact-vulnerabilities.json)"
            printf 'dapper_fixed_all=%s\n' "$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length' evidence/dapper-image-vulnerabilities.json)"
          } | tee evidence/security-summary.txt

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestration-engine-security-${{ github.sha }}
          path: |
            dist/artifacts/cattle.jar
            evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero applicable Critical or High findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/security-summary.txt
          source evidence/security-summary.txt
          for value in "$source_secrets" "$artifact_critical" "$artifact_high" "$artifact_targets" "$artifact_packages" "$artifact_components" "$artifact_jars" "$dapper_critical" "$dapper_high"; do
            case "$value" in
              ''|*[!0-9]*) echo "Incomplete security evidence: $value" >&2; exit 1 ;;
            esac
          done
          test "$source_secrets" -eq 0
          test "$artifact_critical" -eq 0
          test "$artifact_high" -eq 0
          test "$artifact_targets" -gt 0
          test "$artifact_components" -gt 0
          test "$artifact_jars" -gt 0
          test "$artifact_components" -ge "$artifact_jars"
          test "$artifact_packages" -ge "$artifact_jars"
          test "$dapper_critical" -eq 0
          test "$dapper_high" -eq 0

      - name: Clean runner resources
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f $(docker ps -aq --filter ancestor="$DAPPER_IMAGE") 2>/dev/null
          docker image rm -f "$DAPPER_IMAGE" "$TRIVY_IMAGE" 2>/dev/null
          docker builder prune --all --force >/dev/null 2>&1
          # Dapper creates root-owned outputs on this isolated hosted runner.
          test "$PWD" = "$GITHUB_WORKSPACE" || exit 1
          sudo rm -rf -- "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/runtime" "$GITHUB_WORKSPACE/code/packaging/app/target"
