          suites = []
          observed = {}
          reports = list(Path('code').glob('**/target/surefire-reports/TEST-*.xml'))
          reports += list(Path('resources').glob('**/target/surefire-reports/TEST-*.xml'))
          for path in sorted(reports):
              root = ET.parse(path).getroot()
              cases = []
              for case in root.findall('testcase'):
                  outcomes = [name for name in ('failure', 'error', 'skipped') if case.find(name) is not None]
                  record = {'class': case.get('classname'), 'name': case.get('name'),
                            'status': outcomes[0] if outcomes else 'passed'}
                  cases.append(record)
                  if record['class'] in required and record['name'] in required[record['class']]:
                      key = (record['class'], record['name'])
                      assert key not in observed, ('duplicate required case', key)
                      observed[key] = record['status']
              counts = {name: int(root.get(name, '0')) for name in ('tests', 'failures', 'errors', 'skipped')}
              assert counts['tests'] == len(cases), ('report case count', str(path))
              assert counts['failures'] == counts['errors'] == 0, ('failed unit suite', str(path))
              suites.append({'report': path.as_posix(), 'counts': counts, 'cases': cases})
          assert suites, 'No executed Surefire unit reports'
          expected = {(name, case) for name, cases in required.items() for case in cases}
          assert set(observed) == expected and set(observed.values()) == {'passed'}, (
              'Required cases missing, skipped or failed', sorted(expected - set(observed)),
              sorted(key for key, value in observed.items() if value != 'passed'))
          summary = {'source': Path('evidence/source-revision.txt').read_text().strip(),
                     'suiteCount': len(suites), 'totals': {name: sum(s['counts'][name] for s in suites)
                     for name in ('tests', 'failures', 'errors', 'skipped')}, 'suites': suites}
          Path('evidence/unit-test-results.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
          fixture = Path('code/iaas/model/target/native-name-refresh-lifecycle-select.sql')
          assert fixture.is_file(), 'Missing source-generated lifecycle SELECT'
          Path('evidence/native-name-refresh-lifecycle-select.sql').write_bytes(fixture.read_bytes())
          print('UNIT_CASE_EVIDENCE_OK', summary['suiteCount'], summary['totals'])
          PY

